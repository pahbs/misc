name: Update site monitor

on:
  schedule:
    - cron: "17 */4 * * *"   # every 4 hours
  workflow_dispatch:         # "Run workflow" button for an update on demand

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - name: Fetch and encrypt GoatCounter stats
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
          MONITOR_PASSPHRASE: ${{ secrets.MONITOR_PASSPHRASE }}
        run: python monitor/fetch_stats.py
      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain -- monitor/data)" ]; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monitor/data
          git commit -m "monitor: update stats"
          git push
